# SevenMirror Server deployment.
#
# relay     the persistent public relay. Non-root, read-only root filesystem,
#           every capability dropped, and published only on host loopback.
# admin     one-shot workspace administration. Runs with no network at all.
# admin-web the on-demand management console. Loopback only, never published.
#
# Copy .env.example to .env, set every value, then follow docs/deployment.md.
# Relative bind mounts resolve beside this file, so data/ and authority/ stay
# under deploy/compose/ unless the operator changes the paths deliberately.

services:
  relay:
    image: ${SEVENMIRROR_IMAGE:?Set SEVENMIRROR_IMAGE to an immutable image reference}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${SEVENMIRROR_RELAY_BIND:?Set the host loopback address and port}:8080"
    environment:
      NM_ADDRESS: "0.0.0.0:8080"
      NM_DATABASE_PATH: "/data/registry.db"
      NM_TRUSTED_PROXY_CIDRS: ${SEVENMIRROR_TRUSTED_PROXY:?Set the exact reverse-proxy source address}
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    profiles: [admin]
    image: ${SEVENMIRROR_IMAGE:?Set SEVENMIRROR_IMAGE to an immutable image reference}
    entrypoint: ["/app/admin"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    environment:
      NM_DATABASE_PATH: "/data/registry.db"
      NM_AUTHORITY_KEY_DIR: "/authority"
    volumes:
      - ./data:/data
      - ./authority:/authority
      - ./backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: none

  admin-web:
    profiles: [admin-web]
    image: ${SEVENMIRROR_IMAGE:?Set SEVENMIRROR_IMAGE to an immutable image reference}
    entrypoint: ["/app/admin-web"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The console refuses any non-loopback listen address and the relay never mounts
    # the authority directory, so it shares the host loopback namespace instead of
    # publishing a port. This makes the service Linux-only.
    network_mode: host
    environment:
      NM_DATABASE_PATH: "/data/registry.db"
      NM_AUTHORITY_KEY_DIR: "/authority"
      NM_ADMIN_ADDRESS: ${SEVENMIRROR_ADMIN_ADDRESS:?Set a loopback address and port}
      NM_ADMIN_ORIGIN: ${SEVENMIRROR_ADMIN_ORIGIN:?Set the exact browser-facing origin}
    volumes:
      - ./data:/data
      - ./authority:/authority
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
