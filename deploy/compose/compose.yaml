# SevenMirror Server 部署文件。
#
# 部署一条命令：
#
#   docker compose up -d
#
# 首次启动时会自动创建工作区，不需要手工初始化，也不需要 .env 文件。
# 持久化数据就在这个文件旁边的 data/、authority/、backups/ 三个目录里，
# 备份就是把它们复制走。
#
# 需要改的只有一处：下面的镜像引用。升级时把 :0.1.0 改成新版本号；
# 想固定到不可变的摘要，就换成 @sha256:<index digest>。

x-image: &sevenmirror-image ghcr.io/huaxianyan/sevenmirror-server:0.1.0

services:
  # 每次 up 都跑一次的初始化。只在没有工作区时创建，已存在则直接成功退出，
  # 所以重复启动不会多出一把权威私钥，也不会挡住 relay。
  #
  # 它的输出不落容器日志（见下方 logging），因为签发加入码的命令会在 stdout
  # 交付一次性密钥，项目规定 admin 输出不得进入日志管道。要看工作区 ID 就用：
  #   docker compose run --rm admin list-workspaces
  prepare:
    image: *sevenmirror-image
    entrypoint: ["/app/admin"]
    command: ["init-workspace"]
    # 用 root 是为了让 Docker 自动创建的挂载目录直接可用，省掉手工 mkdir 与
    # chown。安全收紧三项仍保留：只读根文件系统、丢弃全部 capability、禁止提权。
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 初始化不需要网络。
    network_mode: none
    restart: "no"
    environment:
      NM_DATABASE_PATH: /data/registry.db
      NM_AUTHORITY_KEY_DIR: /authority
      # 备份挂载点由部署声明，程序据此把目录收成 0700。
      NM_BACKUP_DIR: /backups
    volumes:
      - ./data:/data
      - ./authority:/authority
      - ./backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: none

  # 常驻的中继。对外只绑定宿主机回环地址，由你自己的反向代理转发进来。
  relay:
    image: *sevenmirror-image
    restart: unless-stopped
    depends_on:
      # 等工作区建好再启动，否则中继会先对着一个没有工作区的库跑起来。
      prepare:
        condition: service_completed_successfully
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 直接使用宿主机网络命名空间，所以监听地址就是宿主机上的回环地址，
    # 反向代理走回环连进来。这样不需要查任何网桥地址，也不会和已有的
    # Docker 网络冲突。
    network_mode: host
    environment:
      # 反向代理转发到这个地址。改端口时记得同步改反代配置。
      NM_ADDRESS: 127.0.0.1:18081
      NM_DATABASE_PATH: /data/registry.db
      # 只有反向代理可以声明客户端地址，而它总是从回环连入。
      # 不要放宽成网段：那样该网段内任何对端都能伪造客户端地址。
      NM_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # 镜像里没有 shell、curl 或 wget，所以探针用镜像自己的二进制。
    # /readyz 会真的读一次 registry，因此“起得来但读不到 registry”
    # 会被报成 unhealthy，而不是看起来正常。
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性工作区管理。不连接网络，也是唯一能读到权威私钥的服务。
  admin:
    profiles: [admin]
    image: *sevenmirror-image
    entrypoint: ["/app/admin"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    environment:
      NM_DATABASE_PATH: /data/registry.db
      NM_AUTHORITY_KEY_DIR: /authority
      NM_BACKUP_DIR: /backups
    volumes:
      - ./data:/data
      - ./authority:/authority
      - ./backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: none

  # 按需启动的管理界面。用完就停，会话只存在内存里。
  # 只监听回环地址，通过 SSH 隧道访问；不对外暴露。
  admin-web:
    profiles: [admin-web]
    image: *sevenmirror-image
    entrypoint: ["/app/admin-web"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: host
    environment:
      NM_DATABASE_PATH: /data/registry.db
      NM_AUTHORITY_KEY_DIR: /authority
      NM_ADMIN_ADDRESS: 127.0.0.1:8081
      # 只有通过域名访问管理端时才需要这一项，默认值就是上面的地址。
      # 如果设了，必须与浏览器地址栏逐字符一致，含协议与端口。
      # NM_ADMIN_ORIGIN: https://sevenmirror-admin.example.com
    volumes:
      - ./data:/data
      - ./authority:/authority
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
