# SevenMirror Server nginx reverse-proxy example.
#
# Replace mirror.example.com with your own hostname, point its A/AAAA record at
# this host, and give nginx a certificate for it (for example through certbot).
# The relay itself publishes only 127.0.0.1:18081 and serves plain HTTP behind
# this proxy.
#
# Two things this example does on purpose:
#
#   - It replaces any incoming X-Forwarded-For instead of appending to it. Only
#     your proxy may name the client address; otherwise a caller could pick its
#     own rate-limit bucket.
#   - It enables the WebSocket upgrade headers. The relay authenticates on the
#     first binary frame, so a proxy that strips Upgrade breaks device
#     connectivity instead of failing loudly.
#
# The relay trusts the Compose gateway pinned in compose.yaml (172.28.0.1/32) as
# the only peer allowed to supply a forwarded address. Keep the two in step.

# Map the connection header only for requests that actually ask to upgrade, so
# plain HTTP requests are not given a stray Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mirror.example.com;

    # Issue certificates with certbot --nginx, or redirect to HTTPS yourself.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mirror.example.com;

    ssl_certificate     /etc/letsencrypt/live/mirror.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirror.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # No access log by default. The relay's own reduced log and the operator's
    # retention policy are the intended record; a proxy log would add client
    # addresses on top of it. Enable one deliberately if you need it.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;

        # WebSocket upgrade, required for the relay.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Replace, never append, so a caller cannot choose its own bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # The relay authenticates on the first frame and then streams; do not let
        # a short read timeout drop idle-but-healthy connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
