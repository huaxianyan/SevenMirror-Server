name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: true
      - name: Verify project license
        run: |
          echo '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  LICENSE' | sha256sum --check -
          grep -Fq 'GPL-3.0-only' LICENSE-TRANSITION.md
          grep -Fq 'a057ab234c237b16f54e3786e54263d84c64e1e8' LICENSE-TRANSITION.md
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal protocol)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build commands
        run: |
          go build ./cmd/server
          go build ./cmd/admin
      - name: Build container
        run: docker build .
